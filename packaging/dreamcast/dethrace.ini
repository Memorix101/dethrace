[General]
; Disable original CD / censorship checks
CdCheck = 0
GoreCheck = 0

; The Dreamcast comfortably targets 30 fps
FPSLimit = 60

; Always full screen on console
Windowed = 0

; Software render path. The PowerVR hardware path is a separate driver.
Emulate3DFX = 0

; Cut scenes (Smacker FMV). Re-enabled now that the DC3D_MAX_TRIS fix freed
; ~1.2 MB, so the intro FMV's decode buffers no longer tip the heap into OOM.
Cutscenes = 1

; 320x200, not the 640x480 "hires" assets
Hires = 0

; Required on the Dreamcast's 16 MB of RAM
LowMemory = 1

[Sound]
Enabled = 1
VolumeMultiplier = 1
